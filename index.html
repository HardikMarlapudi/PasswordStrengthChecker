<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>PasswordChecker</title>
</head>
<body>
    
    <h2 id="title">Password Strength Checker</h2>

    <h4 id="passwordScore">Password Strength: 0%</h4>

    <div class="container">
        <input type="text" id="passwordInput" placeholder="Enter your password...">
        <button type="submit" id="checkPassword" onclick="check()">Check Password</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
